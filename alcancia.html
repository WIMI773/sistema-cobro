<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Alcancía – Sistema de Cobro</title>
  <link rel="icon" href="logocobro.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    .gastos-resumen {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ecfdf5;
      border: 1px solid #22c55e;
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 0;
    }

    .gastos-resumen .resumen-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #15803d;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .gastos-resumen .resumen-valor {
      font-size: 1.5rem;
      font-weight: 800;
      color: #15803d;
    }

    .gasto-grupo {
      margin-bottom: 14px;
    }

    .gasto-fecha-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 2px 6px;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 6px;
    }

    .gasto-subtotal {
      color: #374151;
      font-weight: 800;
    }

    .gasto-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 6px;
      background: #fff;
      border: 1px solid #e5e7eb;
    }

    .gasto-icono {
      font-size: 1.5rem;
      flex-shrink: 0;
      width: 36px;
      text-align: center;
      line-height: 36px;
    }

    .gasto-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .gasto-info strong {
      font-size: 0.88rem;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gasto-nota {
      font-size: 0.74rem;
      color: #9ca3af;
      font-style: italic;
    }

    .gasto-derecha {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .gasto-valor {
      font-size: 0.92rem;
      font-weight: 800;
      color: #15803d;
      white-space: nowrap;
    }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #111827;
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 9999;
      white-space: nowrap;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div>
        <h1>Alcancía</h1>
        <div class="periodo-label" style="margin-top:6px;color:#6b7280;font-weight:600;">Ingresos guardados por separado</div>
      </div>
      <div class="header-actions">
        <span id="usuarioEmail"></span>
        <a href="index.html" style="text-decoration:none;"><button class="btn-secondary small">← Inicio</button></a>
        <a href="reportes.html" style="text-decoration:none;"><button class="btn-secondary small">📊 Reportes</button></a>
        <a href="gastos.html" style="text-decoration:none;"><button class="btn-secondary small">💸 Gastos</button></a>
        <button id="logoutButton" class="btn-danger small">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <aside class="panel panel-left">

      <div class="card card-small">
        <h2>Buscar alcancía</h2>
        <input
          type="text"
          id="buscarAlcancia"
          placeholder="Buscar por descripción"
          oninput="buscarAlcancias()"
        />
      </div>

      <div id="nuevoAlcanciaCard" class="card card-small hidden">
        <h2>Nuevo ingreso de alcancía</h2>

        <input type="text" id="alcanciaDescripcion" placeholder="Descripción *" />
        <input type="number" id="alcanciaValor" placeholder="Valor $ *" min="0" step="100" />

        <label style="font-size:0.8rem;font-weight:600;color:#374151;margin-bottom:2px;display:block;">Fecha</label>
        <input type="date" id="alcanciaFecha" />

        <input type="text" id="alcanciaNota" placeholder="Nota (opcional)" style="margin-top:4px;" />

        <button onclick="guardarAlcancia()" style="margin-top:10px;">Guardar alcancía</button>
        <button type="button" class="btn-secondary" onclick="ocultarNuevaAlcancia()">Cancelar</button>
      </div>

      <div class="gastos-resumen">
        <span class="resumen-label">🐷 Total alcancía</span>
        <span class="resumen-valor" id="totalAlcancias">$0</span>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;">
          <h2>Ingresos de alcancía</h2>
          <button class="btn-secondary small" onclick="toggleNuevaAlcancia()">+ Nuevo ingreso</button>
        </div>
        <div id="listaAlcancias" class="client-list"></div>
      </div>

    </aside>
  </main>

  <button class="fab" onclick="toggleNuevaAlcancia()" aria-label="Crear ingreso">+</button>
  <div id="toast" class="toast"></div>
  <script type="module" src="alcancia.js"></script>
</body>
</html>
